[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
version = "0.1.0"
description = "MewCode Lite — a minimal terminal coding agent built from scratch (no agent framework): ReAct loop, tool calling, streaming tool_calls assembly."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.setuptools]
packages = ["mewcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
